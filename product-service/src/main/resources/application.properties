spring.application.name=product-service

# --- Network exposure ---
server.port=8082
server.address=${BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.max-http-request-header-size=16KB
server.server-header=

# --- Never leak internals in error responses; no debug output ---
debug=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.main.banner-mode=off
spring.mvc.log-request-details=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# --- Strict input handling ---
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
spring.web.resources.add-mappings=false

# --- Database: credentials come only from the environment ---
spring.datasource.url=${PRODUCT_DB_URL}
spring.datasource.username=${PRODUCT_DB_USER}
spring.datasource.password=${PRODUCT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

# --- Only the gateway may call this service ---
security.internal-api-key=${INTERNAL_API_KEY}
