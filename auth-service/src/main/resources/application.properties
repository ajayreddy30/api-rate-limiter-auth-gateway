spring.application.name=auth-service

# --- Network exposure ---
server.port=8081
# Loopback by default; docker-compose sets BIND_ADDRESS=0.0.0.0 inside the private network.
server.address=${BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.max-http-request-header-size=16KB
server.server-header=

# --- Never leak internals in error responses; no debug output ---
debug=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.main.banner-mode=off
spring.mvc.log-request-details=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

# --- Strict input handling ---
# Unknown JSON fields are rejected (blocks mass-assignment such as {"role":"ADMIN"}).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
spring.web.resources.add-mappings=false

# --- Database: credentials come only from the environment ---
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
# The application never changes the schema by itself: schema.sql creates it, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

# --- Secrets: no defaults on purpose; the service refuses to start without them ---
security.internal-api-key=${INTERNAL_API_KEY}
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:api-gateway-auth}
jwt.audience=${JWT_AUDIENCE:api-gateway}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

# Optional one-time admin bootstrap (remove after the first start)
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
