   name: ci

   on:
     push:
       branches: [main]
     pull_request:

   permissions:
     contents: read

   jobs:
     build-and-test:
       runs-on: ubuntu-latest
       strategy:
         fail-fast: false
         matrix:
           module: [auth-service, product-service, api-gateway]
       services:
         redis:
           image: redis:7-alpine
           ports: ["6379:6379"]
           options: >-
             --health-cmd "redis-cli ping"
             --health-interval 5s
             --health-timeout 3s
             --health-retries 10
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: "21"
             cache: maven
         - name: Build and test
           run: mvn -B -ntp verify
           working-directory: ${{ matrix.module }}

     secret-scan:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
           with:
             fetch-depth: 0
         - name: Install gitleaks (pinned version, checksum verified)
           run: |
             VERSION=8.30.1
             curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
             curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
             sha256sum --check --ignore-missing "gitleaks_${VERSION}_checksums.txt"
             tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
         - name: Scan the full git history
           run: ./gitleaks detect --source . --redact --verbose
